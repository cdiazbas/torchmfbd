telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    # 128-px patches with a 24-px apodization border. With 64-px patches the edges bias the fit: iterating longer
    # makes the object worse. On synthetic and real-sunspot bursts with a known truth (marginal loss, LBFGS 10,
    # stride 32), the object error is 13-23 % lower and the PSF transfer error 29-45 % lower than with 64 px and
    # border 10, also with 6 frames, noise x2 and anisoplanatism. It is slower: about x1.5 per patch set and x3 on
    # the 512-px burst. A wider border (32 px) loses the information near the edges.
    n_pixel : 128
    pix_size : 0.059
    apodization_border : 24
    remove_gradient_apodization : True

object1:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: 250.0

object2:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: 250.0
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.00
    lr_modes : 0.08
    lr_prior : 0.08
    loss_type: marginal
    # The PSD parameters stop being fitted once more than 20 modes are active: with the linear annealing below and
    # LBFGS 10 (spot_8542_kl_patches.py), after 5 of the 10 steps. The longer they are fitted, the broader the
    # fitted PSFs. On synthetic bursts with a known truth this gives a better object and better PSFs than fitting
    # them throughout; 5 gives a slightly better object with PSFs that come out too narrow.
    stop_psd_optimization: 20
    show_object_info: False

regularization:
     iuwt1:
        variable : object
        lambda : 0.00
        nbands : 5

psf:
    model : kl
    nmax_modes : 54
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.1
    end_pct : 0.6

psd:
    K: 250.0
    v0: 0.1
    p: 2.0