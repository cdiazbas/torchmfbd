telescope:
    diameter: 100.0
    central_obscuration : 0.0

images:
    # 128-px patches with a 24-px apodization border. With 64-px patches the edges bias the fit: iterating longer
    # makes the object worse. On synthetic and real-sunspot bursts with a known truth (marginal loss, LBFGS 10,
    # stride 32), the object error is 13-23 % lower and the PSF transfer error 29-45 % lower than with 64 px and
    # border 10, also with 6 frames, noise x2 and anisoplanatism. It is slower: about x1.5 per patch set and x3 on
    # the 512-px burst. A wider border (32 px) loses the information near the edges.
    n_pixel : 128
    pix_size : 0.059
    apodization_border : 24
    remove_gradient_apodization : True

object1:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    # object prior level from the noise of the frames and their number (joint loss): 250 (sigma/0.02) max(12/N, 1)
    s_u_joint: auto

object2:
    wavelength : 8542.0
    image_filter: scharmer
    cutoff : [0.95, 0.99]
    s_u_joint: auto
    
optimization:
    gpu : 0
    transform : softplus
    softplus_scale : 1.0    
    lr_obj : 0.00
    lr_modes : 0.08
    lr_prior : 0.08
    # Joint loss with the prior level from the noise (s_u_joint: auto) and the coupling of neighbouring patches below.
    # Against the marginal loss on the benchmark (128-px patches, stride 32, LBFGS 10; benchmarks/run.py): object error
    # 10.6 % lower on 55 scenes with 6 frames (43 better, none >25 % worse), 11.5 % lower on 42 scenes with neighbours
    # at 12 frames (35 better; real sunspot crops and two-layer seeing), 20.3 % lower on 13 one-patch synthetic scenes;
    # each the mean of the per-scene changes.
    loss_type: joint
    # Marginal loss only (ignored with joint): the PSD parameters stop being fitted once more than 20 modes are active,
    # after 5 of the 10 LBFGS steps. Fitting them throughout gives broader PSFs and a worse object.
    stop_psd_optimization: 20
    show_object_info: False

regularization:
     # Neighbouring patches see almost the same low-order seeing: their first 10 wavefront coefficients are pulled
     # together (needs set_neighbours in the script and all patches in one batch). Weight 30 for stride 32
     coupling:
        lambda : 30.0
        n_modes : 10
     iuwt1:
        variable : object
        lambda : 0.00
        nbands : 5

psf:
    model : kl
    nmax_modes : 54
    jitter : none

initialization:
    object : contrast
    modes_std : 0.0

annealing:
    type: linear
    start_pct : 0.1
    end_pct : 0.6

psd:
    K: 250.0
    v0: 0.1
    p: 2.0